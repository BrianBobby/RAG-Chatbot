<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CitiBusiness Chat</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
  <div class="flex-container">
    <div class="card chat-card">
      <div class="card-body p-4 d-flex flex-column">
        <div class="d-grid col-1 mx-auto mb-3">
          <!-- gradient icon -->
          <svg class="gradient-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16">
            <defs>
              <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" style="stop-color:#42e695;stop-opacity:1" />
                <stop offset="50%" style="stop-color: #3bbfc9;stop-opacity:1" />
                <stop offset="100%" style="stop-color:#309499;stop-opacity:1" />
              </linearGradient>
            </defs>
            <path fill="url(#grad1)" d="M8.186 1.113a.5.5 0 0 0-.372 0L1.846 3.5 8 5.961 14.154 3.5zM15 4.239l-6.5 2.6v7.922l6.5-2.6V4.24zM7.5 14.762V6.838L1 4.239v7.923zM7.443.184a1.5 1.5 0 0 1 1.114 0l7.129 2.852A.5.5 0 0 1 16 3.5v8.662a1 1 0 0 1-.629.928l-7.185 2.874a.5.5 0 0 1-.372 0L.63 13.09a1 1 0 0 1-.63-.928V3.5a.5.5 0 0 1 .314-.464z"/>
          </svg>
        </div>

        <h2 class="mb-1">CitiBusiness Assistant</h2>
        <p class="text-muted mb-3">Ask questions about the document. Answers come from the uploaded manual.</p>

        <!-- CHAT WINDOW -->
        <div id="chatWindow" class="chat-window mb-3">
          <!-- messages will be injected here -->
        </div>

        <form id="chatForm" class="d-flex gap-2 align-items-center" onsubmit="return false;">
          <input id="queryInput" class="form-control" type="text" placeholder="Type your question..." autocomplete="off" required>
          <button id="sendBtn" class="btn btn-primary">Ask</button>
        </form>

        <div id="status" class="mt-2 text-muted small"></div>
      </div>
    </div>
  </div>

  <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
